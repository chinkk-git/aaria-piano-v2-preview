name: Build and deploy Piano Kingdom

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Piano Kingdom
        uses: actions/checkout@v4
      - name: Get the pinned on-device OMR engine source
        uses: actions/checkout@v4
        with:
          repository: pzfreo/partsong
          ref: 9834842408b3012730b76249e0c3738820a08912
          path: omr-source
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare OMR runtime and local model assets
        run: |
          cd omr-source
          bash scripts/fetch-libs.sh
          bash scripts/fetch-models.sh
          cd ..
          rm -rf _site
          mkdir -p _site/omr _site/models _site/lib/onnxruntime-web@1.30.0 _site/vendor/omr-licenses
          cp index.html song-import.js my-songs.js sw.js piano-geometry.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png _site/
          mkdir -p _site/assets/piano-hero-v2
          for asset in home_button settings_button; do
            cp "assets/piano-hero-v2/${asset}.png" _site/assets/piano-hero-v2/
          done
          cp piano-hero-v2.css _site/
          cp omr-source/omr-worker.js _site/
          cp -R omr-source/omr/. _site/omr/
          cp -R omr-source/models/. _site/models/
          cp -R omr-source/lib/onnxruntime-web@1.30.0/. _site/lib/onnxruntime-web@1.30.0/
          cp OMR-THIRD-PARTY-NOTICES.md _site/
          cp omr-source/LICENSE _site/vendor/omr-licenses/partsong-LICENSE
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
